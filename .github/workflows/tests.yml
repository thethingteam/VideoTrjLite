name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes vtl vtl_ui main.py tests
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Tests (Linux, virtual display so the Tk UI tests run too)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
