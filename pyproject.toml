[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-trj-integration-lite"
dynamic = ["version"]
description = "Align one video with a GPX/NMEA track, extract geotagged frames (CSV + EXIF GPS)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chi-Min Chiu" }]
keywords = ["gpx", "nmea", "video", "geotag", "exif", "photogrammetry"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "av>=12,<20",
    "numpy>=1.24",
    "Pillow>=10,<14",
    "piexif>=1.1,<2",
    "tkinterdnd2>=0.4,<1",
]

[project.urls]
Homepage = "https://thethingteam.github.io/VideoTrjLite/"
Repository = "https://github.com/thethingteam/VideoTrjLite"
Issues = "https://github.com/thethingteam/VideoTrjLite/issues"

[project.optional-dependencies]
fallback = ["opencv-python>=4.9,<6"]  # only used when PyAV cannot open a file
dev = ["pyinstaller>=6.10,<7", "pyflakes>=3"]

[project.scripts]
vtl = "vtl.cli:main"

[project.gui-scripts]
vtl-ui = "vtl_ui.app:main"

[tool.setuptools]
packages = ["vtl", "vtl.track", "vtl.video", "vtl_ui"]

[tool.setuptools.dynamic]
version = { attr = "vtl.__version__" }
